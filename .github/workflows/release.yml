name: Release

# dev/vX.Y.Z → release PR 이 머지되면 브랜치 이름에서 버전을 파싱해
# vX.Y.Z 태그와 GitHub Release 를 만든다. 노트는 두 부분으로 나눈다.
# - [릴리즈 노트]: release PR 본문의 '## 릴리즈 노트' 섹션 (사용자용 문장)
# - [개발자 노트]: 직전 릴리즈 이후 머지된 PR 목록 (GitHub 자동 생성)
on:
  pull_request:
    types: [closed]
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'dev/v')
    runs-on: ubuntu-latest
    steps:
      - name: 태그 · 릴리즈 생성
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          VER="${HEAD#dev/}"
          [[ "$VER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::브랜치 이름에서 버전을 찾지 못했어요: $HEAD"; exit 1; }
          PREV=$(gh release list --repo "$REPO" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')

          # 사용자용: release PR 본문의 '## 릴리즈 노트' 부터 다음 '## ' 제목 전까지
          printf '%s\n' "$PR_BODY" | tr -d '\r' \
            | awk '/^## 릴리즈 노트[[:space:]]*$/{f=1;next} f&&/^## /{exit} f' > user.md

          # 개발자용: GitHub 자동 생성 노트 (.github/release.yml 라벨 분류)
          ARGS=(-f tag_name="$VER" -f target_commitish="$SHA")
          if [ -n "$PREV" ]; then ARGS+=(-f previous_tag_name="$PREV"); fi
          gh api -X POST "repos/$REPO/releases/generate-notes" "${ARGS[@]}" --jq .body \
            | sed -e '/^<!--.*-->$/d' -e "/^## What's Changed/d" > dev.md

          {
            echo "## [릴리즈 노트]"
            cat user.md
            echo
            echo "## [개발자 노트]"
            cat dev.md
          } > notes.md

          gh release create "$VER" --repo "$REPO" --target "$SHA" --title "$VER" --notes-file notes.md
          echo "릴리즈 $VER 생성 (이전: ${PREV:-없음})" >> "$GITHUB_STEP_SUMMARY"
