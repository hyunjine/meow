<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>Meow PRD v1.0.0</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5/github-markdown-light.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .wrap { max-width: 900px; margin: 40px auto; padding: 40px; background: #fff; border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .markdown-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    pre { overflow-x: auto; }
  </style>
</head>
<body>
  <article class="wrap markdown-body" id="content">불러오는 중…</article>
  <script>
    fetch('PRD-v1.0.0.md')
      .then(r => r.text())
      .then(md => { document.getElementById('content').innerHTML = marked.parse(md); })
      .catch(e => { document.getElementById('content').textContent = '에러: ' + e.message; });
  </script>
</body>
</html>
